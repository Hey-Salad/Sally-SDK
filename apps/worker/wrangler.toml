name = "heysalad-sally-worker"
account_id = "67a17ada4efeee4480283035cc0c5f90"
main = "src/index.ts"
compatibility_date = "2026-03-19"
# Same-zone fetch() must hit the Cloudflare edge, not the zone origin.
# This does not block RFC1918. The URL classifier does that.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[[routes]]
pattern = "api-sally-sdk.heysalad.app/*"
zone_name = "heysalad.app"

[[d1_databases]]
binding = "DB"
database_name = "heysalad-sally"
database_id = "5897d527-ae67-468e-bc8d-bd21f3ff5fac"
migrations_dir = "migrations"

# Auth fails closed in the Worker. Do not set ALLOW_INSECURE_LOCAL_DEV in this file.
# Local wrangler dev uses .dev.vars (see .dev.vars.example), which is not deployed.
[vars]
SALLY_ENV = "production"
ALLOWED_ORIGINS = "https://heysalad-sally-dashboard.pages.dev"
